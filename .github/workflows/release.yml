name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs the earlier tags to find the previous version.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Writes the notes from the commits since the previous tag, grouped as
      # .goreleaser.yaml says, and publishes the GitHub release.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Asking the module proxy for the new version makes pkg.go.dev list it
      # without waiting for someone to `go get` it first.
      - name: announce to the Go module proxy
        run: curl -fsS "https://proxy.golang.org/github.com/chhongzh/lilt/@v/${GITHUB_REF_NAME}.info"
